[project]
name = "retinal-fundus-classification"
version = "0.2.0"
description = "Retinal fundus image classification (CNN / transfer learning) with AC-GAN augmentation experiments"
requires-python = ">=3.10,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = [
    "ignore::UserWarning:sklearn.*",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["legacy"]  # original research scripts, kept verbatim apart from Stage-1 fixes

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "UP007", "B905"]  # zip(strict=) adds noise for same-length arrays

[tool.ruff.lint.isort]
known-first-party = ["src", "app"]
