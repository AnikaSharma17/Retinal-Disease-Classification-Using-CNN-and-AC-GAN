# The original project CNN trained from scratch on the same split: the in-repo baseline.
name: multilabel_small_cnn
seed: 42
data:
  manifest: data/manifest_split.csv
  task: multilabel
  classes: [DM, Hypertension, Heart Disease, Cholesterol]
  img_size: 128
model:
  arch: small_cnn
  pretrained: false
train:
  epochs: 40
  fine_tune_epochs: 0
  batch_size: 8
  lr: 1.0e-3
